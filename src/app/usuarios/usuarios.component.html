<a routerLink="../">Página inicial</a> <br>

<form>
    <input
        type="text"
        placeholder="Login"
        class="form-control"
        name="login"
        [(ngModel)]="usuario.login">
    
    <input
        type="password"
        placeholder="Senha"
        class="form-control"
        name="senha"
        [(ngModel)]="usuario.senha">

    <input
        type="text"
        placeholder="ID da pessoa"
        class="form-control"
        name="idPessoa"
        [(ngModel)]="usuario.idPessoa">
    
    <input
        type="button"
        value="Cadastrar"
        *ngIf="btnCadastro"
        class="btn btn-primary"
        (click)="cadastrar()">

    <input
        type="button"
        value="Alterar"
        *ngIf="!btnCadastro"
        class="btn btn-warning"
        (click)="editar()">

    <input
        type="button"
        value="Remover"
        *ngIf="!btnCadastro"
        class="btn btn-danger"
        (click)="remover()">

    <input
        type="button"
        value="Cancelar"
        *ngIf="!btnCadastro"
        class="btn btn-secondary"
        (click)="cancelar()">
</form>

<table>
    <thead>
        <tr>
            <th>#</th>
            <th>Login</th>
            <th>ID da pessoa</th>
            <th>Nome</th>
            <th>Idade</th>
            <th>Selecionar</th>
        </tr>
    </thead>

    <tbody>
        <tr *ngFor="let u of usuarios; index as i">
            <td>{{i+1}}</td>
            <td>{{u.login}}</td>
            <td>{{u.pessoa === null ? "" : u.pessoa.id}}</td>
            <td>{{u.pessoa === null ? "" : u.pessoa.nome}}</td>
            <td>{{u.pessoa === null ? "" : calcularIdade(u.pessoa.dataNascimento)}}</td>
            <td>
                <button
                    class="btn btn-success"
                    (click)="selecionarUsuario(i)">
                    Selecionar
                </button>
            </td>
        </tr>
    </tbody>
</table>
